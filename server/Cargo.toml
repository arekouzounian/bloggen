[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Shared AST types
bgc-ast = { path = "../client/bgc-ast" }

# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "compression-full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json", "time", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Compression
zstd = "0.13"

# Hashing
blake3 = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Async traits
async-trait = "0.1"

# Time
time = { version = "0.3", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
