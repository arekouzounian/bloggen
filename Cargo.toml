[workspace]
members = [
    "client/bgc",
    "client/bgc-ast",
    "v2-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["BlogGen Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Shared dependencies for consistency
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
zstd = "0.13"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.dev]
# Faster compilation for development
opt-level = 0

[profile.test]
# Optimize tests a bit for better performance
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
