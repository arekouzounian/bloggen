[package]
name = "bgc"
version = "0.1.0"
edition = "2024"

[dependencies]
bgc-ast = { path = "../bgc-ast" }
markdown = "1.0"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rmp-serde = "1.3"
zstd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
anyhow = "1.0"
fuser = "0.16"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.29", features = ["process", "signal"] }
serde_yaml = "0.9"
hex = "0.4"

[dev-dependencies]
tempfile = "3.0"
mockito = "1.2"

[[test]]
name = "comprehensive_tests"
path = "tst/comprehensive_tests.rs"

[[test]]
name = "fuse_tests"
path = "tst/fuse_tests.rs"
